[package]
name = "bevy_net_backend"
version = "0.1.0"
edition = "2021"
# Bevy 0.19's own minimum.
rust-version = "1.95"
description = "Talk to your game's own backend from Bevy: HTTPS JSON requests, (feature `ws`) named WebSocket connections and (feature `ssh`, admin tools) SSH commands and SFTP, typed answers as Bevy messages, exactly one answer per request, game-supplied credentials with redacted secrets, no tokio unless you enable `ssh`, and fake transports for tests."
license = "MIT OR Apache-2.0"
repository = "https://github.com/warmar94/bevy_net_backend"
readme = "README.md"
keywords = ["bevy", "http", "websocket", "ssh", "json"]
categories = ["game-development", "network-programming", "web-programming::http-client"]
# Not part of the published package.
exclude = ["NOTES.md", "docs/", "/target"]

[features]
# Deliberately NOT empty: the crate exists to call an HTTPS JSON API, so the default build does
# exactly that with no feature fiddling. `--no-default-features` still builds the core types and
# the fake transport.
default = ["http", "json"]
# The real transport: ureq 3 (blocking HTTP/1.1) on a small pool of worker threads, rustls for TLS
# with ring's crypto (compiles C and assembly: a C compiler is needed at build time) and the Mozilla
# root certificates (webpki-roots).
http = ["dep:ureq", "dep:rustls"]
# Typed JSON requests and answers (`get_json`, `post_json`, `JsonResponse<T>`) over serde_json.
json = ["dep:serde", "dep:serde_json"]
# Accept gzip-compressed responses (ureq's gzip decoder, flate2).
gzip = ["http", "ureq/gzip"]
# Named WebSocket connections: tungstenite (sync, no async runtime) on one dedicated thread per
# connection, TLS through the same rustls + ring setup as `http`. No permessage-deflate.
ws = ["dep:tungstenite", "dep:rustls", "dep:webpki-roots"]
# ADMIN / DEV BUILDS ONLY. Named SSH connections that run commands (russh, ring for the AEAD
# ciphers, RustCrypto for the rest), strict known_hosts checking, key files / ssh-agent / the
# user's ~/.ssh/config. The ONLY feature that brings tokio: one private current-thread runtime on
# its own thread. Refuses to run in release builds unless the plugin opts in.
ssh = ["dep:russh", "dep:tokio", "dep:ssh2-config", "dep:glob", "dep:hmac", "dep:sha1", "dep:zeroize"]
# SFTP file operations (upload, download, list, mkdir, remove, rename) on SSH connections.
sftp = ["ssh", "dep:russh-sftp"]
# RSA host keys and RSA key files for SSH (rsa-sha2-256/512). Off by default: the `rsa` crate carries
# the unfixed Marvin timing advisory RUSTSEC-2023-0071.
ssh-rsa = ["ssh", "russh/rsa"]

# Bevy is pinned EXACTLY and only its sub-crates are used, without default features: the crate adds
# no Bevy feature a game did not ask for, and a game on Bevy 0.19.0 ends up with ONE Bevy.
[dependencies]
bevy_app = { version = "=0.19.0", default-features = false, features = ["std"] }
bevy_ecs = { version = "=0.19.0", default-features = false, features = ["std"] }
# `Time<Real>` for the request deadlines.
bevy_time = { version = "=0.19.0", default-features = false, features = ["std"] }
# Bevy's logging goes through `tracing`; its subscriber (LogPlugin) picks these messages up.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# The public vocabulary: `Method`, `StatusCode`, `HeaderMap`, `HeaderName`, `HeaderValue`, `Uri`.
# ureq uses the same crate, so it costs nothing extra. Caret, not `=`: a shared vocabulary crate
# (like serde_json below) must be able to move with the game's other dependencies.
http = { version = "1.5" }
serde = { version = "1", default-features = false, features = ["std"], optional = true }
serde_json = { version = "1.0.140", optional = true }
# The ring provider is always handed to ureq explicitly (never a process-wide default), so a game
# that also links another rustls provider (e.g. aws-lc-rs) cannot trigger rustls' provider panic.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"], optional = true }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "ring"], optional = true }
# The WebSocket protocol engine (feature `ws`): only its `handshake` feature, none of its TLS
# features (they would call `ClientConfig::builder()` and bring a second webpki-roots).
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"], optional = true }
# Mozilla's root certificates for `wss://` (the same crate ureq uses for `https://`). Caret: the root
# list must be able to move forward.
webpki-roots = { version = "1.0.9", optional = true }
# The SSH client (feature `ssh`). ring only (the same ring as TLS), never aws-lc; RSA only with
# `ssh-rsa`. Pinned exactly: SSH security fixes arrive as patch releases, bumped deliberately.
russh = { version = "=0.63.3", default-features = false, features = ["ring"], optional = true }
# russh needs a tokio runtime: one private current-thread runtime on the crate's own SSH thread.
tokio = { version = "1.44", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"], optional = true }
# `~/.ssh/config` host aliases (HostName, Port, User, IdentityFile).
ssh2-config = { version = "=0.8.1", optional = true }
# `Include` patterns of ssh_config, expanded by us with limits (the same glob ssh2-config uses).
glob = { version = "0.3", optional = true }
# Hashed known_hosts entries (`|1|salt|hash` = HMAC-SHA1); the same versions russh uses.
hmac = { version = "0.13", optional = true }
sha1 = { version = "0.11", default-features = false, optional = true }
# Wipes key file contents read into memory.
zeroize = { version = "1.7", optional = true }
# The SFTP subsystem (feature `sftp`).
russh-sftp = { version = "=3.0.1", optional = true }

[dev-dependencies]
# Tests + examples: MinimalPlugins, headless.
bevy = { version = "=0.19.0", default-features = false, features = ["std", "bevy_log"] }
bevy_headless_test = { version = "0.1.0", default-features = false }
serde = { version = "1", features = ["derive"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# A throwaway test CA + localhost certificate generated in memory for the TLS tests (ring backend,
# no aws-lc). Tests only: nothing key-shaped is in the repository or the package.
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
# Random seeds for the throwaway SSH keys of the mock SSH server and the SSH tests (the same
# getrandom russh already uses). Keys are generated at runtime; none is in the repository.
getrandom = { version = "0.4", features = ["sys_rng"] }

# Examples run against a mock server they start on 127.0.0.1 (or against `BACKEND_URL`).
[[example]]
name = "mock_server"

[[example]]
name = "fetch_json"
required-features = ["http", "json"]

[[example]]
name = "post_with_token"
required-features = ["http", "json"]

[[example]]
name = "mock_ws_server"
required-features = ["ws", "json"]

[[example]]
name = "chat_client"
required-features = ["ws", "json"]

[[test]]
name = "ws_fake"
required-features = ["ws", "json"]

# The `ws` feature without `json`: raw frames only.
[[test]]
name = "ws_raw"
required-features = ["ws"]

[[test]]
name = "ws_loopback"
required-features = ["ws", "json"]

# Live WSS checks against a test server (the WS mock behind a TLS proxy). `#[ignore]`d: run only
# on request, with BNB_TEST_WSS_URL set.
[[test]]
name = "live_ws"
required-features = ["ws", "json"]

[[example]]
name = "mock_ssh_server"
required-features = ["ssh"]

[[example]]
name = "ssh_console"
required-features = ["ssh"]

[[test]]
name = "ssh_fake"
required-features = ["ssh"]

[[test]]
name = "ssh_loopback"
required-features = ["ssh"]

# Live SSH checks against a real OpenSSH server. `#[ignore]`d: run only on request, with
# BNB_TEST_HOST, BNB_TEST_SSH_USER, BNB_TEST_SSH_KEY and BNB_TEST_SSH_KNOWN_HOSTS set.
[[test]]
name = "live_ssh"
required-features = ["ssh"]

[[test]]
name = "fake"

[[test]]
name = "redaction"

[[test]]
name = "loopback"
required-features = ["http"]

# Live HTTPS checks against a test server (the mock behind a TLS proxy). `#[ignore]`d: run only on
# request, with BNB_TEST_HTTPS_URL set.
[[test]]
name = "live"
required-features = ["http", "json"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

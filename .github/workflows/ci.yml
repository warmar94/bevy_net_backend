name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

# Rust is pinned to the dev version (never @stable): a newer Rust's new clippy lints must not turn CI red on
# unchanged code. Upgrading Rust = bump this in every job, run clippy, fix. Users are unaffected (rust-version).
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - run: cargo fmt --all --check

  # Every feature combination must compile cleanly on its own (features are additive).
  clippy:
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - ""
          - "--features gzip"
          - "--no-default-features --features http"
          - "--no-default-features --features json"
          - "--no-default-features --features ws"
          - "--no-default-features --features ws,json"
          - "--features ws"
          - "--features ws,gzip"
          - "--features ssh"
          - "--no-default-features --features ssh"
          - "--features ssh,sftp"
          - "--features ssh,ssh-rsa"
          - "--features ssh,ws"
          - "--features os-certificates"
          - "--no-default-features --features os-certificates"
          - "--features ws,os-certificates"
          - "--features oauth"
          - "--no-default-features --features oauth"
          - "--features oauth,ws"
          - "--all-features"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets ${{ matrix.features }} -- -D warnings

  # Tests use the fake transport and a mock server on 127.0.0.1 inside the test process: no outside network.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked
      - run: cargo test --locked --features gzip
      - run: cargo test --locked --no-default-features --features http
      - run: cargo test --locked --no-default-features --features json
      - run: cargo test --locked --no-default-features --features ws
      - run: cargo test --locked --no-default-features --features ws,json
      - run: cargo test --locked --features ws
      - run: cargo test --locked --features ws,gzip
      # SSH: the real transport runs against the in-process mock SSH server on 127.0.0.1.
      - run: cargo test --locked --features ssh
      - run: cargo test --locked --no-default-features --features ssh
      - run: cargo test --locked --features ssh,sftp
      - run: cargo test --locked --features ssh,ssh-rsa
      - run: cargo test --locked --features ssh,ws
      - run: cargo test --locked --features ws,os-certificates
      # OAuth (desktop sign-in) without `ssh`: no async runtime.
      - run: cargo test --locked --features oauth
      - run: cargo test --locked --no-default-features --features oauth
      - run: cargo test --locked --features oauth,ws
      - run: cargo test --locked --all-features

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps --all-features
      - run: cargo doc --locked --no-deps --no-default-features
      - run: cargo doc --locked --no-deps --features ssh
      - run: cargo doc --locked --no-deps --features oauth

  # The minimum supported Rust version (Cargo.toml `rust-version`) really builds.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-features
      - run: cargo build --locked --no-default-features

  # The dependency rules: no async runtime unless `ssh` is enabled (also none with `ws`), no OpenSSL /
  # native-tls / aws-lc / libssh2 in any set, one ring, one rustls, one russh, no second webpki-roots.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      # "No tokio unless you enable `ssh`": every set without `ssh`.
      - run: |
          for f in "--no-default-features" "" "--features gzip" "--no-default-features --features http" "--no-default-features --features json" "--features ws" "--no-default-features --features ws" "--features ws,gzip" "--features oauth" "--no-default-features --features oauth" "--features oauth,ws"; do
            if cargo tree --locked --target all -e normal,build $f --prefix none | grep -E '^(tokio|tokio-macros|mio|russh|openssl-sys|native-tls|aws-lc-sys|aws-lc-rs|reqwest|hyper|rustls-rustcrypto|libssh2-sys) '; then
              echo "forbidden dependency with [$f]"; exit 1
            fi
          done
      # With `ssh`: tokio is allowed, but still no OpenSSL / aws-lc / libssh2 / libsodium.
      - run: |
          for f in "--features ssh" "--features ssh,sftp" "--features ssh,ssh-rsa" "--all-features"; do
            if cargo tree --locked --target all -e normal,build $f --prefix none | grep -E '^(openssl-sys|native-tls|aws-lc-sys|aws-lc-rs|reqwest|hyper|rustls-rustcrypto|libssh2-sys|ssh2|libsodium-sys) '; then
              echo "forbidden dependency with [$f]"; exit 1
            fi
          done
      - run: |
          for c in ring rustls russh tokio; do
            if [ "$(cargo tree --locked --all-features -e normal,build -i $c --depth 0 --prefix none | wc -l)" != "1" ]; then
              echo "more than one $c"; exit 1
            fi
          done
      # No aws-lc anywhere, dev-dependencies included (rcgen is built with ring only). Note: tokio
      # does appear in the dev tree through bevy's wasm-only dependencies; the tokio rule above is
      # checked on normal + build dependencies only.
      - run: |
          # `openssl-probe` (feature `os-certificates`, Linux / BSD: finds the system's CA files) links no OpenSSL.
          if grep -E 'name = "(aws-lc|openssl|libssh2)' Cargo.lock | grep -v 'name = "openssl-probe"'; then echo "aws-lc / openssl / libssh2 in Cargo.lock"; exit 1; fi
          if cargo tree --locked --all-features --target all -e normal,dev,build --prefix none | grep -E '^(aws-lc|openssl-sys|native-tls|libssh2-sys) '; then
            echo "forbidden crate in the dev tree"; exit 1
          fi
      # No key material in the repository (test certificates and SSH keys are generated at runtime).
      - run: |
          if grep -rlE "BEGIN ([A-Z]+ )?PRIVATE KEY" --exclude-dir=target --exclude-dir=.git .; then echo "key material in the repository"; exit 1; fi
      - run: |
          if [ "$(cargo tree --locked --all-features -e normal,build -i webpki-roots --depth 0 --prefix none | wc -l)" != "1" ]; then
            echo "more than one webpki-roots"; exit 1
          fi
      - run: |
          if grep -A1 'name = "bevy' Cargo.lock | grep -q 'version = "0.19.1"'; then
            echo "a Bevy 0.19.1 crate is in Cargo.lock"; exit 1
          fi
